name: Build and Test
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-v*"
  pull_request:
    branches:
      - "main"
      - "release-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST || 'ghcr.io' }}
  IMAGE_REPO_PREFIX: ${{ vars.IMAGE_REPO_PREFIX || (github.repository == 'openchoreo/openchoreo' && 'ghcr.io/openchoreo' || '') }}
  HELM_OCI_REGISTRY: ${{ vars.HELM_OCI_REGISTRY || (github.repository == 'openchoreo/openchoreo' && 'oci://ghcr.io/openchoreo/helm-charts' || '') }}
  PUBLISH_LATEST: ${{ vars.PUBLISH_LATEST || (github.repository == 'openchoreo/openchoreo' && 'true' || 'false') }}
  IMAGE_PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64 linux/arm64' || 'linux/amd64' }}
  CLI_EXTRA_PLATFORMS: ${{ github.event_name == 'push' && 'darwin/amd64 darwin/arm64 windows/amd64 windows/arm64' || '' }}

jobs:
  lint:
    if: ${{ github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true' }}
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release branches must not install 0.0.0-latest-dev observability modules
      # (e.g. reintroduced by a backport from main).
      - name: Check observability module pins
        if: startsWith(github.base_ref, 'release-v') || startsWith(github.ref_name, 'release-v')
        run: hack/pin-observability-modules.sh --check

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run linter
        run: make lint

  gen-check:
    if: ${{ github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true' }}
    name: Code Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run Code Generation Checks
        run: make code.gen-check

  test:
    if: ${{ github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true' }}
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Running Tests
        run: |
          make go.test

      - name: Upload coverage to Codecov
        if: (github.repository == 'openchoreo/openchoreo' && vars.CODECOV_ENABLED != 'false') || vars.CODECOV_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  build:
    if: ${{ github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true' }}
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Build multiarch binaries
        run: |
          make go.build-multiarch GO_TARGET_PLATFORMS="${{ env.IMAGE_PLATFORMS }}"

          # Build occ for extra platforms (push only)
          if [[ -n "${{ env.CLI_EXTRA_PLATFORMS }}" ]]; then
            make go.build-multiarch.occ GO_TARGET_PLATFORMS="${{ env.CLI_EXTRA_PLATFORMS }}"
          fi

      # Fork source checks need no binary uploads. Publication uses the binaries;
      # release.yml also consumes occ, so preserve its normal retention when
      # release automation is enabled. Other binaries are short-lived inputs.
      - name: Upload occ binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occ
          path: bin/dist/**/occ
          retention-days: ${{ (github.repository == 'openchoreo/openchoreo' || vars.FORK_RELEASE_ENABLED == 'true') && '0' || '1' }}

      - name: Upload manager binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manager
          path: bin/dist/**/manager
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload openchoreo-api binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchoreo-api
          path: bin/dist/**/openchoreo-api
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload observer binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observer
          path: bin/dist/**/observer
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload event-forwarder binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-forwarder
          path: bin/dist/**/event-forwarder
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload cluster-gateway binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-gateway
          path: bin/dist/**/cluster-gateway
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload cluster-agent binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-agent
          path: bin/dist/**/cluster-agent
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload remote-agent binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-agent
          path: bin/dist/**/remote-agent
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

      - name: Upload remote-agent-router binaries
        if: github.repository == 'openchoreo/openchoreo' || (github.event_name == 'push' && vars.FORK_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-agent-router
          path: bin/dist/**/remote-agent-router
          retention-days: ${{ github.repository == 'openchoreo/openchoreo' && '0' || '1' }}

  agent-tests:
    if: ${{ github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true' }}
    name: Agent Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: agents/*/uv.lock

      - name: Run tests
        # uv reads each agent's .python-version (3.14) and provisions the
        # interpreter. ruff lint/format is intentionally deferred until the
        # pre-existing src/ debt is cleaned up; this gates on pytest only.
        run: make python.test

  package-helm:
    name: Package Helm Charts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      ${{ (github.repository == 'openchoreo/openchoreo' || vars.FORK_CI_ENABLED == 'true') &&
          (github.event_name != 'push') }}
    needs: [ lint, gen-check, test, build, agent-tests ]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Package helm charts
        run: make helm-package

  publish:
    name: Publish
    if: >-
      ${{ github.event_name == 'push' &&
          (github.repository == 'openchoreo/openchoreo' ||
           (vars.FORK_CI_ENABLED == 'true' && vars.FORK_PUBLISH_ENABLED == 'true')) }}
    needs: [ lint, gen-check, test, build, agent-tests ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-candidates.yml
    secrets:
      OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
      OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
