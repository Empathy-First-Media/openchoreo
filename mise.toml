min_version = "2026.11.8"

# These are build inputs, not a runtime inventory. The upstream Makefiles own
# generated code, language dependencies, chart generation, and build targets.
[vars]
go_version = "1.26.10"
uv_version = "0.13.8"
helm_version = "3.22.1"
openchoreo_version = "1.3.3"
openchoreo_chart_repository = "oci://ghcr.io/openchoreo/helm-charts"
jactionlint_version = "2.6.0"
shellcheck_version = "0.11.0"
# Local tools/K3s follow v1.3.3; cert-manager follows its current K8s 1.36 matrix.
k3d_version = "5.8.3"
kubectl_version = "1.36.1"
k3s_image = "rancher/k3s:v1.36.1-k3s1"
cert_manager_version = "v1.21.3"
jq_version = "1.8.2"

[tasks."ci:workflow-lint"]
description = "Validate GitHub Actions using current GitHub workflow syntax"
tools."aqua:jdx/jactionlint" = "{{ vars.jactionlint_version }}"
tools.shellcheck = "{{ vars.shellcheck_version }}"
run = '''
set -eu
bash -n deploy/aiagencypro/local/platform.sh
shellcheck deploy/aiagencypro/local/platform.sh
jactionlint --profile correctness
jactionlint \
  .github/workflows/build-and-test.yml \
  .github/workflows/codeql.yml \
  .github/workflows/efm-platform-validation.yml \
  .github/workflows/efm-upstream-sync.yml \
  .github/workflows/external-compatibility-scan-tests.yaml \
  .github/workflows/lint-pr.yml \
  .github/workflows/scorecard.yml
'''

[tasks."ci:workflow-audit"]
description = "Report broader inherited workflow security and policy findings before enabling releases"
tools."aqua:jdx/jactionlint" = "{{ vars.jactionlint_version }}"
tools.shellcheck = "{{ vars.shellcheck_version }}"
run = "jactionlint"

[tasks."ci:lint"]
description = "Run the upstream source lint targets"
tools.go = "{{ vars.go_version }}"
run = "make lint"

[tasks."ci:generate"]
description = "Run upstream generated-code consistency checks"
tools.go = "{{ vars.go_version }}"
run = "make code.gen-check"

[tasks."ci:test"]
description = "Run upstream Go and Python agent test suites"
tools.go = "{{ vars.go_version }}"
tools.uv = "{{ vars.uv_version }}"
run = "make test"

[tasks."ci:build"]
description = "Build upstream Go binaries for this host"
tools.go = "{{ vars.go_version }}"
run = "make go.build"

[tasks."ci:charts"]
description = "Generate and package source charts using upstream owners"
tools.go = "{{ vars.go_version }}"
tools.helm = "{{ vars.helm_version }}"
run = "make helm-package"

[tasks."platform:charts:pull"]
description = "Download the selected stable release charts, without installing"
tools.helm = "{{ vars.helm_version }}"
run = '''
set -eu
mkdir -p bin/aiagencypro/charts
helm pull {{ vars.openchoreo_chart_repository }}/openchoreo-control-plane --version {{ vars.openchoreo_version }} --destination bin/aiagencypro/charts
helm pull {{ vars.openchoreo_chart_repository }}/openchoreo-data-plane --version {{ vars.openchoreo_version }} --destination bin/aiagencypro/charts
'''

[tasks."platform:validate"]
description = "Lint and render stable charts with private pilot overrides; no cluster writes"
depends = ["platform:charts:pull"]
tools.helm = "{{ vars.helm_version }}"
run = '''
set -eu
helm lint --strict bin/aiagencypro/charts/openchoreo-control-plane-{{ vars.openchoreo_version }}.tgz --values deploy/aiagencypro/values-control-plane.yaml --set-string security.oidc.issuer=https://identity.example.test
helm lint --strict bin/aiagencypro/charts/openchoreo-data-plane-{{ vars.openchoreo_version }}.tgz --values deploy/aiagencypro/values-data-plane.yaml
helm template openchoreo-control-plane bin/aiagencypro/charts/openchoreo-control-plane-{{ vars.openchoreo_version }}.tgz --namespace openchoreo-control-plane --values deploy/aiagencypro/values-control-plane.yaml --set-string security.oidc.issuer=https://identity.example.test > bin/aiagencypro/control-plane.rendered.yaml
helm template openchoreo-data-plane bin/aiagencypro/charts/openchoreo-data-plane-{{ vars.openchoreo_version }}.tgz --namespace openchoreo-data-plane --values deploy/aiagencypro/values-data-plane.yaml > bin/aiagencypro/data-plane.rendered.yaml
'''

[tasks."dev:quickstart"]
description = "Open the official stable quickstart in an explicitly selected Docker context"
raw = true
run = '''
set -eu
: "${DOCKER_CONTEXT:?Select the isolated development Docker context}"
: "${OPENCHOREO_DEV_CONTAINER:?Set a unique name for this disposable dev container}"
endpoint=$(docker --context "$DOCKER_CONTEXT" context inspect "$DOCKER_CONTEXT" --format '{% raw %}{{.Endpoints.docker.Host}}{% endraw %}')
case "$endpoint" in
  unix:///*) ;;
  *) printf '%s\n' 'ERROR: The demo socket mount requires a local Unix-socket Docker context; remote SSH/TCP contexts are refused.' >&2; exit 1 ;;
esac
docker --context "$DOCKER_CONTEXT" info >/dev/null
docker --context "$DOCKER_CONTEXT" run --rm -it --name "$OPENCHOREO_DEV_CONTAINER" --pull always --env OPENCHOREO_VERSION=v{{ vars.openchoreo_version }} --volume /var/run/docker.sock:/var/run/docker.sock --network host ghcr.io/openchoreo/quick-start:v{{ vars.openchoreo_version }}
'''

[tasks.local]
description = "Operate the isolated Apple Silicon private pilot; defaults to read-only preflight"
tools.k3d = "{{ vars.k3d_version }}"
tools.kubectl = "{{ vars.kubectl_version }}"
tools.helm = "{{ vars.helm_version }}"
tools.jq = "{{ vars.jq_version }}"
env.OPENCHOREO_VERSION = "{{ vars.openchoreo_version }}"
env.OPENCHOREO_CHART_REPOSITORY = "{{ vars.openchoreo_chart_repository }}"
env.OPENCHOREO_K3S_IMAGE = "{{ vars.k3s_image }}"
env.OPENCHOREO_CERT_MANAGER_VERSION = "{{ vars.cert_manager_version }}"
run = "bash deploy/aiagencypro/local/platform.sh"

[tasks."local:validate"]
description = "Check local operator syntax and native k3d configuration without a Docker daemon"
tools.k3d = "{{ vars.k3d_version }}"
tools.shellcheck = "{{ vars.shellcheck_version }}"
env.OPENCHOREO_K3S_IMAGE = "{{ vars.k3s_image }}"
run = '''
set -eu
bash -n deploy/aiagencypro/local/platform.sh
shellcheck deploy/aiagencypro/local/platform.sh
# k3d 5.8.3 has no create --dry-run. Its migrate command uses the native schema
# and parser without contacting Docker. Substitute only these validation inputs;
# the real create command expands operator environment variables itself.
validation_dir=$(mktemp -d)
trap 'rm -rf -- "$validation_dir"' EXIT
sed -e 's/${OPENCHOREO_CLUSTER_NAME}/validation-only/g' \
    -e 's/${OPENCHOREO_KUBE_PORT}/6550/g' \
    -e "s|\${OPENCHOREO_K3S_IMAGE}|$OPENCHOREO_K3S_IMAGE|g" \
    deploy/aiagencypro/local/k3d.yaml > "$validation_dir/k3d.yaml"
k3d config migrate "$validation_dir/k3d.yaml" - >/dev/null
'''
